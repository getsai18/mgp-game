# CI: pruebas unitarias/integración (Vitest) y E2E (Playwright) en cada push y Pull Request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mgp-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mgp-game/package-lock.json
      - run: npm ci
      - name: Pruebas unitarias e integración (Vitest)
        run: npm run test:unit
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Pruebas E2E (Playwright)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            mgp-game/playwright-report
            mgp-game/test-results
          retention-days: 7

  # Despliegue en Render solo si las pruebas pasan y es un push a main (no en Pull Requests).
  # Necesita el secreto del repositorio RENDER_API_KEY (Settings -> Secrets and variables -> Actions).
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Pedir el deploy a Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          curl -fsS -X POST "https://api.render.com/v1/services/srv-dbeea2vb9u1s739e68gg/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
            -d "{\"commitId\": \"$GITHUB_SHA\"}"
