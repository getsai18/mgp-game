# Despliegue en Render (Blueprint): servicio web Node con WebSockets y SSL automático.
services:
  - type: web
    name: arena-caos
    runtime: node
    plan: free
    region: virginia
    rootDir: mgp-game
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
